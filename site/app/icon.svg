<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DuckTerm">
  <defs>
    <!-- Yellow: one family with the in-app ducks (Duck.tsx palette). The dark
         rounded square + orange bill keep it tellable from a plain emoji duck
         at 16px, which is what the old green was protecting. -->
    <linearGradient id="rd-body" x1="12" y1="10" x2="48" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD32B"/>
      <stop offset="1" stop-color="#E0AD00"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0d0f14"/>
  <g fill="url(#rd-body)">
    <!-- lower, rounder body -->
    <ellipse cx="29" cy="44" rx="21" ry="12.5"/>
    <!-- bigger head: cuter proportions, still one silhouette with the body -->
    <circle cx="40" cy="25" r="15.5"/>
  </g>
  <!-- rounder, shorter bill -->
  <path fill="#F47C16" d="M52 21.5c5.2.2 8.6 2.2 8.5 4.8-.1 2.6-3.7 4.4-8.9 4.1-1.4-2.9-1.3-6 .4-8.9z"/>
  <path d="M52.5 26.3h7.6" stroke="#D9620A" stroke-width="1.2" stroke-linecap="round" opacity="0.45"/>
  <!-- wing: soft tucked curve in the shade tone -->
  <path d="M18 43c5 5 15.5 5 21 .5" stroke="#E0AD00" stroke-width="2.6" stroke-linecap="round" fill="none" opacity="0.75"/>
  <!-- bigger eye with bigger highlight -->
  <circle cx="42.5" cy="22.5" r="3.6" fill="#22242b"/>
  <circle cx="44" cy="21" r="1.35" fill="#fff"/>
  <!-- cheek -->
  <ellipse cx="35.5" cy="29.5" rx="3.4" ry="2.1" fill="#F47C16" opacity="0.28"/>
  <!-- glossy crown highlight -->
  <ellipse cx="33" cy="17.5" rx="5.2" ry="3" fill="#fff" opacity="0.30" transform="rotate(-24 33 17.5)"/>
</svg>
